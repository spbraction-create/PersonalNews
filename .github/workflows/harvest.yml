name: Daily Harvest + Edit

# README.md שלבים 3+4: קודם קוצר פידים מאומתים (בלי AI), מסנן 24 שעות, מנקה כפילויות.
# אז, באותו job (בטור, לא במקביל — כדי שה-edit תמיד ירוץ אחרי שה-harvest סיים) —
# מסווג עם Gemini, בוחר, כותב בריף, ובונה את data/daily-edition.json שהאתר החי מגיש.
# שני מועדי schedule בכוונה: ה-schedule של GitHub Actions הוא best-effort — ב-27.8.2026
# הראשי אחר ~10 שעות וב-28.8 נבלע לגמרי. המועד השני ("השלמה") רץ מאוחר יותר; job בשם
# guard בודק לפניו אם כבר הייתה ריצה מוצלחת/פעילה היום, ואם כן — מדלג. כך יש לכל היותר
# גיליון אחד ביום, גם כששני המועדים נורים. דקות לא-עגולות (23, 11) בכוונה — slot-ים
# בראש השעה עמוסים ומתעכבים יותר.
# 02:23 UTC ≈ 05:23 בישראל, 04:11 UTC ≈ 07:11 בישראל (תלוי בשעון קיץ/חורף — קירוב מכוון).
on:
  schedule:
    # רשת ביטחון בלבד מאז 30.8.2026 — הטריגר הראשי הוא Cloudflare Cron ב-03:20 UTC
    # (worker/index.js). ה-cron-ים כאן רצים רק אם Cloudflare עצמו נפל; guard מדלג
    # עליהם אם כבר יש גיליון היום.
    - cron: "23 2 * * *"
    - cron: "11 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "הרץ גם אם כבר הופק גיליון היום (עוקף את guard)"
        type: boolean
        default: false
      forceWeekly:
        description: "הפק מוסף שישי עכשיו, גם אם לא יום שישי (בדיקה ידנית — src/israelTime.js)"
        type: boolean
        default: false
      forceMonthly:
        description: "הפק ירחון עכשיו, גם אם לא ה-1 לחודש (בדיקה ידנית — src/israelTime.js)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read            # ל-guard: קריאת רשימת ריצות קודמות של ה-workflow

jobs:
  # job קטן שרץ ראשון. מחליט אם ה-job הכבד צריך לרוץ בכלל:
  #   - workflow_dispatch עם force=true → תמיד רץ (עקיפה ידנית מכוונת).
  #   - כל השאר (schedule + הטריגר מ-Cloudflare, שהוא workflow_dispatch רגיל) →
  #     רץ רק אם אין עדיין ריצה של היום שהצליחה או שרצה כרגע.
  # כך אם Cloudflare וגם cron של GitHub יורים באותו יום — נוצר רק גיליון אחד.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "workflow_dispatch עם force=true — רצים בכל מקרה"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow harvest.yml \
            --json databaseId,status,conclusion,createdAt \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }} and (.createdAt | startswith(\"$today\")) and (.conclusion == \"success\" or .status == \"in_progress\"))] | length" \
            2>/dev/null) || active=""
          echo "ריצות מוצלחות/פעילות אחרות מהיום ($today): ${active:-<כשל בקריאת הסטטוס>}"
          if [ -n "$active" ] && [ "$active" -gt 0 ] 2>/dev/null; then
            echo "כבר טופל היום — מדלגים על ההרצה הזו"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "אין ריצה של היום (או שהקריאה נכשלה) — ממשיכים, ליתר ביטחון"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  harvest-and-edit:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run harvest

      - name: Commit updated flood file
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily-flood.json
          git diff --cached --quiet || git commit -m "chore: daily harvest $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      # קוראים ל-script ישירות עם node, לא עם `npm run edit-daily` — ה-npm script מוגדר
      # עם `--env-file=.env` לנוחות מקומית, אבל .env לא קיים ב-CI בכלל (הוא ב-.gitignore),
      # ו-node קורס אם הדגל הזה מצביע על קובץ שלא קיים — גם כשהמפתח כבר מגיע כ-env אמיתי.
      # אם זה נכשל (למשל חריגת מכסה של Gemini) — data/daily-flood.json כבר נשמר בשלב הקודם,
      # וה-step הבא עדיין ירוץ (if: always()) ויבדוק אם בכל זאת נכתב תוכן חלקי תקין.
      - name: Edit daily (Gemini)
        run: node scripts/edit-daily.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit edited edition
        if: always()
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily-edition.json data/weekly-queue.json data/monthly-queue.json
          git diff --cached --quiet || git commit -m "chore: daily edition $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      # שני השערים הבאים רצים כל בוקר, אחרי היומי, באותו job — אבל כל סקריפט שוער
      # בזמן בעצמו (src/israelTime.js: יום שישי / 1 לחודש בישראל) ועושה no-op בכל יום
      # אחר. כך אין צורך בעוד cron/guard נפרד — ה-Action שרץ כבר כל בוקר מספיק.
      - name: Edit weekly supplement — Friday only (Gemini)
        if: always()
        run: node scripts/edit-weekly.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_WEEKLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.forceWeekly) && '1' || '' }}

      - name: Commit weekly supplement
        if: always()
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/weekly-edition.json data/weekly-queue.json
          git diff --cached --quiet || git commit -m "chore: weekly supplement $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Edit monthly magazine — 1st of month only (Gemini)
        if: always()
        run: node scripts/edit-monthly.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_MONTHLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.forceMonthly) && '1' || '' }}

      - name: Commit monthly magazine
        if: always()
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/monthly-edition.json data/monthly-queue.json
          git diff --cached --quiet || git commit -m "chore: monthly magazine $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
